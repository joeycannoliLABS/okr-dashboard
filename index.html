<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ava Labs OKRs</title>
<meta name="color-scheme" content="dark light">
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colors.
  try { var t = localStorage.getItem("okr-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #101012; --panel: #17171a; --line: #2a2a30;
    --text: #f4f4f2; --muted: #9a9aa3; --red: #ff394a;
    --fill: #f4f4f2; --track: #2a2a30;
    --s-notstarted: #8d8d97; --s-ontrack: #3fd98f; --s-atrisk: #ffb52e;
    --s-completed: #5aa9ff; --s-deprioritized: #6a6a74; --s-onhold: #c48dff;
    --s-unset: #6a6a74;
    --overdue: #ff6b6b; --soon: #ffb52e;
    --on-overdue: #2a0808; --on-soon: #1b1300;
    --mark: rgba(255, 181, 46, .28);
    --sidebar: 268px;
  }
  /* Light theme: follows the system setting unless the viewer picked dark, or picked light explicitly. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f5f5f7; --panel: #ffffff; --line: #d9d9de;
      --text: #141416; --muted: #5c5c66; --red: #c8192a;
      --fill: #141416; --track: #e3e3e8;
      --s-notstarted: #6e6e78; --s-ontrack: #0f7f4c; --s-atrisk: #a35f00;
      --s-completed: #1a63c4; --s-deprioritized: #9a9aa3; --s-onhold: #7a45c9;
      --s-unset: #9a9aa3;
      --overdue: #c62828; --soon: #a35f00;
      --on-overdue: #ffffff; --on-soon: #ffffff;
      --mark: rgba(255, 181, 46, .4);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f5f7; --panel: #ffffff; --line: #d9d9de;
    --text: #141416; --muted: #5c5c66; --red: #c8192a;
    --fill: #141416; --track: #e3e3e8;
    --s-notstarted: #6e6e78; --s-ontrack: #0f7f4c; --s-atrisk: #a35f00;
    --s-completed: #1a63c4; --s-deprioritized: #9a9aa3; --s-onhold: #7a45c9;
    --s-unset: #9a9aa3;
    --overdue: #c62828; --soon: #a35f00;
    --on-overdue: #ffffff; --on-soon: #ffffff;
    --mark: rgba(255, 181, 46, .4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 4px; }
  .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--fill); border-radius: 99px; transition: width .4s ease; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; font-weight: 600; }

  .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .side { border-right: 1px solid var(--line); padding: 22px 18px 40px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
  .main { padding: 0 36px 80px; min-width: 0; }

  .brand { font-weight: 800; font-stretch: 112%; display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand img { width: 24px; height: auto; display: block; flex: none; }
  .brand span { color: var(--muted); font-weight: 500; font-stretch: 100%; font-size: 13px; }

  .years { display: flex; gap: 6px; margin-bottom: 12px; }
  .years button { flex: 1; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .years button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .searchbox { position: relative; margin-bottom: 6px; }
  .searchbox input { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 13.5px; padding: 9px 30px 9px 11px; border-radius: 8px; }
  .searchbox input::placeholder { color: var(--muted); }
  .searchbox button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 17px; line-height: 1; cursor: pointer; padding: 4px 7px; }
  .searchbox button[hidden] { display: none; }

  .nav-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 14px; }
  .nav a:hover { background: var(--panel); color: var(--text); }
  .nav a[aria-current="page"] { background: var(--panel); color: var(--text); font-weight: 600; }
  .nav a .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--s-notstarted)); flex: none; }
  .nav a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav a .pc { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted); }
  .nav a .badge { font-size: 11.5px; font-weight: 700; background: var(--soon); color: var(--on-soon); border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .live { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-ontrack); }
  .live.err .dot { background: var(--s-atrisk); }
  .live button { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 6px 13px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; padding: 0; }
  .icon-btn:hover { border-color: var(--muted); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb a { text-decoration: none; }
  .crumb a:hover { color: var(--text); }

  .banner { margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--s-atrisk); color: var(--s-atrisk); border-radius: 8px; font-size: 14px; }
  .banner[hidden] { display: none; }
  .loading { padding: 60px 0; color: var(--muted); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; padding: 44px 0 38px; align-items: end; }
  h1 { margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1.03; font-weight: 800; font-stretch: 118%; letter-spacing: -.01em; }
  .lede { color: var(--muted); max-width: 48ch; margin: 16px 0 0; }
  .big .num { font-size: clamp(84px, 12vw, 168px); line-height: .85; font-weight: 900; font-stretch: 125%; letter-spacing: -.03em; margin: 0; }
  .big .num small { font-size: .36em; font-stretch: 100%; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .big .label { margin: 12px 0 14px; color: var(--muted); font-size: 14px; }

  .strip { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .strip div { padding: 18px 16px 18px 0; }
  .strip div + div { padding-left: 16px; border-left: 1px solid var(--line); }
  .strip b { display: block; font-size: 28px; font-weight: 800; font-stretch: 112%; line-height: 1.1; }
  .strip span { color: var(--muted); font-size: 13px; }
  .strip .jump { all: unset; display: block; cursor: pointer; border-radius: 6px; }
  .strip .jump span { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  .strip .jump:hover span, .strip .jump:focus-visible span { color: var(--text); text-decoration-style: solid; text-decoration-color: currentColor; }
  .strip .jump:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  h2.section { scroll-margin-top: 20px; }

  h2.section { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 40px 0 16px; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .group .nm { font-size: 13px; color: var(--muted); font-weight: 600; }
  .group .pct { font-size: 30px; font-weight: 800; font-stretch: 115%; line-height: 1; margin: 8px 0 10px; font-variant-numeric: tabular-nums; }
  .group .sub { color: var(--muted); font-size: 12.5px; margin-top: 8px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { display: block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card:hover { border-color: var(--muted); }
  .card .nm { font-weight: 700; font-stretch: 110%; font-size: 17px; }
  .card .grp { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card .pct { font-size: 34px; font-weight: 800; font-stretch: 115%; line-height: 1; margin: 14px 0 10px; font-variant-numeric: tabular-nums; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
  .card .meta .status { display: inline-flex; align-items: center; gap: 6px; }
  .card .meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .card.missing .pct { color: var(--muted); font-size: 17px; font-weight: 600; margin-bottom: 0; }

  .rows { border-top: 1px solid var(--line); }
  .rows .row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 120px 150px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .rows a.row:hover { background: var(--panel); }
  .rows .dept { color: var(--muted); font-size: 13px; }
  .rows .t { font-size: 14.5px; }

  .flag { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 8px; margin-left: 8px; white-space: nowrap; }
  .flag.overdue { background: var(--overdue); color: var(--on-overdue); }
  .flag.soon { background: var(--soon); color: var(--on-soon); }

  .checkgroup { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; background: var(--panel); }
  .checkgroup h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; font-stretch: 110%; }
  .checkgroup .n { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .checkgroup ul { margin: 0; padding: 0; list-style: none; }
  .checkgroup li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
  .checkgroup li .what { color: var(--s-atrisk); font-weight: 600; white-space: nowrap; }
  .checkgroup li .where { color: var(--muted); font-size: 13px; }
  .clean { color: var(--s-ontrack); }

  .objective { padding: 40px 0 18px; border-top: 1px solid var(--line); margin-top: 26px; }
  .obj-head { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 36px; align-items: end; margin-bottom: 22px; }
  .obj-head .eyebrow { color: var(--red); }
  .obj-head h3 { margin: 0; font-size: clamp(21px, 2.6vw, 31px); line-height: 1.1; font-weight: 800; font-stretch: 115%; max-width: 30ch; }
  .obj-score { text-align: right; }
  .obj-score b { display: block; font-size: 44px; line-height: 1; font-weight: 800; font-stretch: 118%; margin-bottom: 10px; font-variant-numeric: tabular-nums; }

  .cols, .kr { display: grid; grid-template-columns: minmax(0, 2.6fr) 76px 76px 76px minmax(120px, 1.2fr) 110px 128px 104px; gap: 14px; align-items: center; }
  .cols { color: var(--muted); font-size: 12px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  .kr { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .kr[hidden] { display: none; }
  .kr .text { font-size: 15px; line-height: 1.4; }
  .val { font-variant-numeric: tabular-nums; font-size: 14px; }
  .val.cur { font-weight: 700; }
  .val.tbd { color: var(--muted); }
  .prog { display: flex; align-items: center; gap: 10px; }
  .prog .bar { flex: 1; height: 6px; }
  .prog em { font-style: normal; font-variant-numeric: tabular-nums; width: 38px; text-align: right; font-size: 13px; font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .status.hollow i { background: transparent; border: 2px solid var(--c); }
  .date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cal { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; justify-self: start; }
  .cal.committed { border-color: var(--text); }
  .cal.none { border: 0; color: var(--muted); padding-left: 0; }
  .lab { display: none; }

  .filters { display: flex; gap: 8px; margin: 30px 0 4px; flex-wrap: wrap; align-items: center; }
  .filters p { margin: 0 8px 0 0; color: var(--muted); font-size: 13px; }
  .chip-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip-btn[aria-pressed="true"] { color: var(--text); border-color: var(--text); }

  footer { padding: 36px 0 20px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 28px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }

  @media (max-width: 1080px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 20px 20px; }
    .nav { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav a { padding: 7px 12px; border: 1px solid var(--line); }
    .nav-label { width: 100%; margin: 12px 0 4px; }
    .main { padding: 0 20px 60px; }
    .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 32px; }
    .strip { grid-template-columns: repeat(2, 1fr); }
    .strip div:nth-child(odd) { padding-left: 0; border-left: 0; }
    .strip div { border-bottom: 1px solid var(--line); }
    .obj-head { grid-template-columns: 1fr; gap: 16px; }
    .obj-score { text-align: left; }
    .cols { display: none; }
    .kr { grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
    .kr .text, .kr .prog { grid-column: 1 / -1; }
    .rows .row { grid-template-columns: 1fr 1fr; }
    .rows .row .t { grid-column: 1 / -1; }
    .lab { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>
</head>

<script>
const REFRESH_MS = 120000;
const SOON_DAYS = 30;
const DAY = 86400000;

const STATUS_COLOR = {
  "Not Started": "var(--s-notstarted)",
  "On Track": "var(--s-ontrack)",
  "At Risk": "var(--s-atrisk)",
  "Completed": "var(--s-completed)",
  "Deprioritized": "var(--s-deprioritized)",
  "On Hold": "var(--s-onhold)",
  "Paused": "var(--s-onhold)",
  "Not set": "var(--s-unset)"
};
const HOLLOW = new Set(["Not Started", "Deprioritized", "On Hold", "Paused", "Not set"]);
const ATTENTION = new Set(["At Risk", "On Hold", "Paused"]);

const cache = {};
let year = "2026";
let page = "overview";
let filter = "all";
let search = "";
let loading = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p) => Math.round((p || 0) * 100);
const colorOf = (s) => STATUS_COLOR[s] || "var(--muted)";
const avg = (l) => (l.length ? l.reduce((a, b) => a + b, 0) / l.length : null);
const statusOf = (kr) => kr.status || "Not set";

function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseISO(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDate(iso) {
  if (!iso) return "No date";
  return parseISO(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

// A key result is only flagged on its deadline if it is not already finished.
function dueState(kr) {
  if (!kr.due || statusOf(kr) === "Completed") return "";
  const diff = parseISO(kr.due) - today0();
  if (diff < 0) return "overdue";
  if (diff <= SOON_DAYS * DAY) return "soon";
  return "";
}
function dueFlag(kr) {
  const st = dueState(kr);
  if (!st) return "";
  const days = Math.round((parseISO(kr.due) - today0()) / DAY);
  return st === "overdue"
    ? `<span class="flag overdue">${days === 0 ? "Due today" : Math.abs(days) + "d over"}</span>`
    : `<span class="flag soon">${days}d left</span>`;
}

function krsOf(dept) {
  return (dept.objectives || []).flatMap((o) => (o.krs || []).map((k) => ({ ...k, objective: o.title })));
}
function statusCounts(list) {
  const c = {};
  list.forEach((k) => { const s = statusOf(k); c[s] = (c[s] || 0) + 1; });
  return c;
}
function attentionCount(list) { return list.filter((k) => ATTENTION.has(statusOf(k))).length; }

/* ---------- data checks ---------- */
function checksFor(dept, yr) {
  const out = [];
  const add = (what, where) => out.push({ what, where });
  const yrNum = Number(yr);

  if (dept.cycle) {
    const bad = ["start", "end"].filter((k) => dept.cycle[k] && parseISO(dept.cycle[k]).getFullYear() !== yrNum);
    if (bad.length) add("Cycle dates are not " + yr, `Sheet header says ${dept.cycle.start || "–"} to ${dept.cycle.end || "–"}`);
  }
  if (dept.overall === null || dept.overall === undefined) add("No overall progress", "The Overall Progress cell is empty");

  (dept.objectives || []).forEach((o, i) => {
    const label = `Objective ${i + 1}: ${o.title || "(untitled)"}`;
    if (!o.title) add("Objective has no title", `Objective ${i + 1}`);
    if (!(o.krs || []).length) { add("Objective has no key results", label); return; }
    if (o.progress === null) add("Objective has no progress", label);

    o.krs.forEach((kr, j) => {
      const where = `${label} · KR ${j + 1}`;
      if (kr.target === "TBD") add("No target value", where);
      if (kr.current === "TBD") add("No current value", where);
      if (kr.progress === null) add("No progress value", where);
      if (!kr.status) add("No confidence level", where);
      if (!kr.due) add("No deadline", where);
      else if (parseISO(kr.due).getFullYear() !== yrNum) add(`Deadline outside ${yr}`, `${where} · ${fmtDate(kr.due)}`);
      if (kr.progress !== null && kr.progress >= 1 && kr.current !== "TBD" && kr.current === kr.start && kr.start !== kr.target) {
        add("Progress is 100% but the current value still equals the start value", where);
      }
    });
  });
  return out;
}

/* ---------- routing ---------- */
function readHash() {
  const m = (location.hash || "").replace(/^#/, "").match(/^(\d{4})-(.+)$/);
  if (m) { year = m[1]; page = m[2]; } else { year = "2026"; page = "overview"; }
}
function go(y, p) { location.hash = `${y}-${p}`; }

/* ---------- data ---------- */
async function load(force) {
  if (loading) return;
  loading = true;
  const y = year;
  try {
    const res = await fetch(`/api/okrs?year=${y}`, { cache: force ? "reload" : "default" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    cache[y] = body;
    $("#banner").hidden = true;
    $("#live").classList.remove("err");
    $("#liveText").textContent = "Updated " + new Date(body.updatedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (err) {
    $("#live").classList.add("err");
    $("#liveText").textContent = cache[y] ? "Showing the last update" : "Not connected";
    $("#banner").hidden = false;
    $("#banner").textContent = `Could not load the OKR sheets: ${err.message}` + (cache[y] ? " Showing the last data received." : "");
  } finally {
    loading = false;
    render();
  }
}

/* ---------- rendering ---------- */
function render() {
  const data = cache[year];
  document.querySelectorAll(".years button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.year === year)));

  if (!data) {
    $("#nav").innerHTML = "";
    $("#view").innerHTML = $("#banner").hidden ? '<p class="loading">Loading OKRs from the department sheets…</p>' : "";
    return;
  }

  // Executive Office leads; every other department is alphabetical.
  const depts = [...data.departments].sort((a, b) => {
    if (a.slug === "executive") return -1;
    if (b.slug === "executive") return 1;
    return a.name.localeCompare(b.name);
  });
  renderNav(depts);

  if (search.trim()) { renderSearch(depts); }
  else if (page === "checks") { renderChecks(depts); }
  else {
    const dept = depts.find((d) => d.slug === page);
    if (page !== "overview" && !dept) { go(year, "overview"); return; }
    if (dept) renderDept(dept); else renderOverview(depts);
  }

  $("#srcNote").textContent = `Source: the ${year} tab of each department's OKR sheet.`;
  $("#cycleNote").textContent = cycleNote();
}

function renderNav(depts) {
  const link = (slug, label, lead, trail) =>
    `<a href="#${year}-${slug}"${page === slug && !search.trim() ? ' aria-current="page"' : ""}>${lead || ""}<span class="nm">${esc(label)}</span>${trail || ""}</a>`;

  const issues = depts.filter((d) => !d.error).reduce((n, d) => n + checksFor(d, year).length, 0);

  const rows = depts.map((d) => {
    if (d.error) return link(d.slug, d.name, `<span class="dot" style="--c:var(--s-notstarted)"></span>`);
    const ks = krsOf(d);
    const flagged = attentionCount(ks) + ks.filter((k) => dueState(k) === "overdue").length;
    const dot = `<span class="dot" style="--c:${flagged ? "var(--s-atrisk)" : "var(--s-ontrack)"}"></span>`;
    return link(d.slug, d.name, dot, `<span class="pc">${pct(d.overall)}%</span>`);
  }).join("");

  $("#nav").innerHTML =
    `<p class="nav-label">Company</p>` +
    link("overview", "Overview") +
    link("checks", "Data checks", "", issues ? `<span class="badge">${issues}</span>` : "") +
    `<p class="nav-label">Departments</p>${rows}`;
}

function renderOverview(depts) {
  const live = depts.filter((d) => !d.error);
  const missing = depts.filter((d) => d.error);
  const allKrs = live.flatMap((d) => krsOf(d).map((k) => ({ ...k, dept: d })));
  const counts = statusCounts(allKrs);
  const overall = avg(live.map((d) => d.overall).filter((v) => typeof v === "number"));
  const overdue = allKrs.filter((k) => dueState(k) === "overdue");
  const soon = allKrs.filter((k) => dueState(k) === "soon");

  const groupNames = [...new Set(live.map((d) => d.group))].sort();
  const groups = groupNames.map((g) => {
    const members = live.filter((d) => d.group === g);
    const score = avg(members.map((d) => d.overall).filter((v) => typeof v === "number"));
    const ks = members.flatMap(krsOf);
    return `<div class="group">
      <div class="nm">${esc(g)}</div>
      <div class="pct">${score === null ? "–" : pct(score) + "%"}</div>
      <div class="bar"><span style="width:${score === null ? 0 : pct(score)}%"></span></div>
      <div class="sub">${members.length} department${members.length === 1 ? "" : "s"} · ${ks.length} key results · ${attentionCount(ks)} flagged</div>
    </div>`;
  }).join("");

  const cards = depts.map((d) => {
    if (d.error) {
      return `<a class="card missing" href="#${year}-${d.slug}">
        <div class="nm">${esc(d.name)}</div><div class="grp">${esc(d.group)}</div>
        <div class="pct">No ${year} tab yet</div></a>`;
    }
    const ks = krsOf(d);
    const c = statusCounts(ks);
    const od = ks.filter((k) => dueState(k) === "overdue").length;
    const chips = Object.keys(c).sort().map((s) =>
      `<span class="status"><i style="--c:${colorOf(s)}"></i>${c[s]} ${esc(s)}</span>`).join("");
    return `<a class="card" href="#${year}-${d.slug}">
      <div class="nm">${esc(d.name)}</div><div class="grp">${esc(d.group)}</div>
      <div class="pct">${pct(d.overall)}%</div>
      <div class="bar"><span style="width:${pct(d.overall)}%"></span></div>
      <div class="meta"><span>${d.objectives.length} objectives</span><span>${ks.length} key results</span>${od ? `<span class="flag overdue">${od} overdue</span>` : ""}</div>
      <div class="meta">${chips}</div></a>`;
  }).join("");

  const attention = allKrs.filter((k) => ATTENTION.has(statusOf(k)))
    .sort((a, b) => (a.progress ?? 0) - (b.progress ?? 0));
  const deadlines = [...overdue, ...soon]
    .sort((a, b) => parseISO(a.due) - parseISO(b.due));

  $("#crumb").textContent = `${year} Company Overview`;
  $("#view").innerHTML = `
    <section class="hero">
      <div>
        <p class="eyebrow">${year} Executive &amp; department OKRs</p>
        <h1>Where every team stands this year.</h1>
        <p class="lede">Live from each department's OKR sheet. Pick a department on the left, or search to find a key result anywhere.</p>
      </div>
      <div class="big">
        <p class="num">${overall === null ? "–" : pct(overall)}<small>%</small></p>
        <p class="label">Company progress, average of the ${live.length} departments reporting</p>
        <div class="bar" role="progressbar" aria-label="Company progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${overall === null ? 0 : pct(overall)}"><span style="width:${overall === null ? 0 : pct(overall)}%"></span></div>
      </div>
    </section>
    <div class="strip">
      <div><b>${live.length}${missing.length ? `<span style="color:var(--muted);font-size:16px"> / ${depts.length}</span>` : ""}</b><span>Departments reporting</span></div>
      <div><b>${allKrs.length}</b><span>Key results</span></div>
      <div><b>${counts["On Track"] || 0}</b><span>On track</span></div>
      <div><button type="button" class="jump" data-jump="sec-attention"><b>${attention.length}</b><span>At risk, on hold or paused</span></button></div>
      <div><button type="button" class="jump" data-jump="sec-deadlines"><b>${overdue.length}</b><span>Past deadline</span></button></div>
    </div>
    <h2 class="section">By group</h2>
    <div class="groups">${groups}</div>
    <h2 class="section">Departments</h2>
    <div class="cards">${cards}</div>
    <h2 class="section" id="sec-attention" tabindex="-1">Needs attention —${attention.length} key result${attention.length === 1 ? "" : "s"}</h2>
    <div class="rows">${rowList(attention) || '<p class="loading">Nothing flagged at risk, on hold or paused.</p>'}</div>
    <h2 class="section" id="sec-deadlines" tabindex="-1">Deadlines —${overdue.length} past due, ${soon.length} within ${SOON_DAYS} days</h2>
    <div class="rows">${rowList(deadlines) || '<p class="loading">Nothing overdue or due soon.</p>'}</div>`;
}

// One row per key result, used by the attention, deadline and search lists.
function rowList(list, term) {
  return list.map((k) => `
    <a class="row" href="#${year}-${k.dept.slug}">
      <div><div class="dept">${esc(k.dept.name)}</div><div class="t">${term ? highlight(k.text, term) : esc(k.text)}</div></div>
      <div class="prog"><div class="bar"><span style="width:${k.progress === null ? 0 : pct(k.progress)}%"></span></div><em>${k.progress === null ? "–" : pct(k.progress) + "%"}</em></div>
      <div><span class="status" style="--c:${colorOf(statusOf(k))}"><i></i>${esc(statusOf(k))}</span></div>
      <div class="date">${fmtDate(k.due)}${dueFlag(k)}</div>
    </a>`).join("");
}

function highlight(text, term) {
  const i = text.toLowerCase().indexOf(term.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length));
}

function renderSearch(depts) {
  const term = search.trim();
  const low = term.toLowerCase();
  const hits = depts.filter((d) => !d.error)
    .flatMap((d) => krsOf(d).map((k) => ({ ...k, dept: d })))
    .filter((k) => k.text.toLowerCase().includes(low) || (k.objective || "").toLowerCase().includes(low) || k.dept.name.toLowerCase().includes(low));

  $("#crumb").innerHTML = `<a href="#${year}-overview">${year} Overview</a> &nbsp;›&nbsp; Search`;
  $("#view").innerHTML = `
    <section class="hero"><div>
      <p class="eyebrow">Search · ${year}</p>
      <h1>${hits.length} key result${hits.length === 1 ? "" : "s"} matching “${esc(term)}”</h1>
      <p class="lede">Searching the text of every key result, objective and department name. Click a result to open its department.</p>
    </div></section>
    <div class="rows">${rowList(hits, term) || '<p class="loading">No key results match that search.</p>'}</div>`;
}

function renderChecks(depts) {
  const live = depts.filter((d) => !d.error);
  const blocks = live.map((d) => ({ d, issues: checksFor(d, year) })).filter((x) => x.issues.length)
    .sort((a, b) => b.issues.length - a.issues.length);
  const total = blocks.reduce((n, b) => n + b.issues.length, 0);
  const missing = depts.filter((d) => d.error);

  const html = blocks.map(({ d, issues }) => `
    <div class="checkgroup">
      <h3><a href="#${year}-${d.slug}" style="text-decoration:none">${esc(d.name)}</a></h3>
      <div class="n">${issues.length} thing${issues.length === 1 ? "" : "s"} to look at</div>
      <ul>${issues.map((i) => `<li><span class="what">${esc(i.what)}</span><span class="where">${esc(i.where)}</span></li>`).join("")}</ul>
    </div>`).join("");

  $("#crumb").innerHTML = `<a href="#${year}-overview">${year} Overview</a> &nbsp;›&nbsp; Data Checks`;
  $("#view").innerHTML = `
    <section class="hero"><div>
      <p class="eyebrow">Data checks · ${year}</p>
      <h1>${total} thing${total === 1 ? "" : "s"} to tidy in the sheets.</h1>
      <p class="lede">Gaps and inconsistencies found in the ${year} tabs. These are prompts for the department owners, not errors in the dashboard. Nothing here changes any sheet.</p>
    </div></section>
    ${missing.length ? `<h2 class="section">No ${year} tab yet</h2><div class="rows"><div class="row" style="grid-template-columns:1fr"><div class="t">${missing.map((d) => esc(d.name)).join(", ")}</div></div></div>` : ""}
    <h2 class="section">By department</h2>
    ${html || '<p class="clean">No issues found. Every key result has a target, a current value, progress, a confidence level and a deadline inside the cycle.</p>'}`;
}

function renderDept(d) {
  $("#crumb").innerHTML = `<a href="#${year}-overview">${year} Overview</a> &nbsp;›&nbsp; ${esc(d.name)}`;

  if (d.error) {
    $("#view").innerHTML = `
      <section class="hero"><div>
        <p class="eyebrow">${esc(d.group)}</p><h1>${esc(d.name)}</h1>
        <p class="lede">${esc(d.error)}. Once the tab is added it shows up here automatically — no changes needed.</p>
        <p class="lede"><a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">Open the OKR sheet</a></p>
      </div></section>`;
    return;
  }

  const ks = krsOf(d);
  const counts = statusCounts(ks);
  const overdue = ks.filter((k) => dueState(k) === "overdue").length;

  const objectives = d.objectives.map((o, i) => {
    const score = o.progress === null ? 0 : pct(o.progress);
    const rows = (o.krs || []).map((kr) => {
      const st = statusOf(kr);
      const hollow = HOLLOW.has(st) ? " hollow" : "";
      const calClass = kr.calibration === "Committed" ? "committed" : (kr.calibration ? "" : "none");
      const p = kr.progress;
      return `
      <div class="kr" data-cal="${esc(kr.calibration)}">
        <div class="text">${esc(kr.text)}</div>
        <div class="val ${kr.start === "TBD" ? "tbd" : ""}"><span class="lab">Start</span>${esc(kr.start)}</div>
        <div class="val cur"><span class="lab">Current</span>${esc(kr.current)}</div>
        <div class="val ${kr.target === "TBD" ? "tbd" : ""}"><span class="lab">Target</span>${esc(kr.target)}</div>
        <div class="prog"><div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p === null ? 0 : pct(p)}"><span style="width:${p === null ? 0 : pct(p)}%"></span></div><em>${p === null ? "–" : pct(p) + "%"}</em></div>
        <div><span class="lab">Confidence</span><span class="status${hollow}" style="--c:${colorOf(st)}"><i></i>${esc(st)}</span></div>
        <div class="date"><span class="lab">Deadline</span>${fmtDate(kr.due)}${dueFlag(kr)}</div>
        <div><span class="lab">Calibration</span><span class="cal ${calClass}">${esc(kr.calibration || "Not set")}</span></div>
      </div>`;
    }).join("");

    return `
    <section class="objective">
      <div class="obj-head">
        <div><p class="eyebrow">Objective ${i + 1}</p><h3>${esc(o.title)}</h3></div>
        <div class="obj-score"><b>${score}%</b><div class="bar" role="progressbar" aria-label="Objective ${i + 1} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${score}"><span style="width:${score}%"></span></div></div>
      </div>
      <div class="cols" aria-hidden="true"><div>Key result</div><div>Start</div><div>Current</div><div>Target</div><div>Progress</div><div>Confidence</div><div>Deadline</div><div>Calibration</div></div>
      ${rows}
    </section>`;
  }).join("");

  $("#view").innerHTML = `
    <section class="hero">
      <div>
        <p class="eyebrow">${esc(d.group)} · ${year}</p>
        <h1>${esc(d.name)}</h1>
        <p class="lede"><a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">Open the OKR sheet</a></p>
      </div>
      <div class="big">
        <p class="num">${pct(d.overall)}<small>%</small></p>
        <p class="label">Overall progress</p>
        <div class="bar" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(d.overall)}"><span style="width:${pct(d.overall)}%"></span></div>
      </div>
    </section>
    <div class="strip">
      <div><b>${d.objectives.length}</b><span>Objectives</span></div>
      <div><b>${ks.length}</b><span>Key results</span></div>
      <div><b>${counts["Completed"] || 0}</b><span>Completed</span></div>
      <div><b>${attentionCount(ks)}</b><span>At risk, on hold or paused</span></div>
      <div><b>${overdue}</b><span>Past deadline</span></div>
    </div>
    <div class="filters" role="group" aria-label="Filter key results">
      <p>Show</p>
      <button class="chip-btn" data-f="all" type="button" aria-pressed="true">All key results</button>
      <button class="chip-btn" data-f="Committed" type="button" aria-pressed="false">Committed</button>
      <button class="chip-btn" data-f="Aspirational" type="button" aria-pressed="false">Aspirational</button>
    </div>
    ${objectives}`;

  document.querySelectorAll(".chip-btn").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; applyFilter(); }));
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll(".kr").forEach((el) => { el.hidden = !(filter === "all" || el.dataset.cal === filter); });
  document.querySelectorAll(".chip-btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}

function cycleNote() {
  const t = today0();
  const start = new Date(Number(year), 0, 1), end = new Date(Number(year), 11, 31);
  if (t < start) return `${year} cycle starts in ${Math.ceil((start - t) / DAY)} days`;
  if (t > end) return `${year} cycle ended`;
  return `${Math.ceil((end - t) / DAY)} days left in ${year}`;
}

/* ---------- events ---------- */
window.addEventListener("hashchange", () => {
  const prevYear = year;
  readHash();
  filter = "all";
  if (search) { search = ""; $("#search").value = ""; $("#clearSearch").hidden = true; }
  render();
  if (year !== prevYear || !cache[year]) load(false);
  window.scrollTo(0, 0);
});
document.querySelectorAll(".years button").forEach((b) => b.addEventListener("click", () => go(b.dataset.year, "overview")));
$("#refresh").addEventListener("click", () => load(true));

// Summary numbers on the overview jump down to their section.
$("#view").addEventListener("click", (e) => {
  const btn = e.target.closest(".jump");
  if (!btn) return;
  const target = document.getElementById(btn.dataset.jump);
  if (!target) return;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  target.focus({ preventScroll: true });
});

/* ---------- theme ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const systemLight = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;

// The theme on screen: the viewer's saved pick if there is one, otherwise the system setting.
function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "light" || t === "dark") return t;
  return systemLight && systemLight.matches ? "light" : "dark";
}
function paintThemeButton() {
  const light = currentTheme() === "light";
  const btn = $("#themeToggle");
  btn.innerHTML = light ? MOON : SUN;
  btn.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
  btn.title = light ? "Dark theme" : "Light theme";
}
$("#themeToggle").addEventListener("click", () => {
  const next = currentTheme() === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("okr-theme", next); } catch (e) {}
  paintThemeButton();
});
if (systemLight && systemLight.addEventListener) systemLight.addEventListener("change", paintThemeButton);
paintThemeButton();

let searchTimer;
$("#search").addEventListener("input", (e) => {
  search = e.target.value;
  $("#clearSearch").hidden = !search;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 120);
});
$("#clearSearch").addEventListener("click", () => {
  search = ""; $("#search").value = ""; $("#clearSearch").hidden = true; render(); $("#search").focus();
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
setInterval(() => { if (!document.hidden) load(false); }, REFRESH_MS);

readHash();
render();
load(false);
</script>
</body>
</html>
